<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>EEE 321 - Yüz Landmark Tespiti</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Yüz Tespiti &amp; Landmark Önizleme</h1>
  <form id="upload-form">
    <input type="file" id="image-input" name="image" accept="image/png, image/jpeg" required>
    <button type="submit">Tespit Et</button>
  </form>
  <p id="status"></p>
  <div class="before-after">
    <figure>
      <figcaption>Önce</figcaption>
      <img id="original-image" alt="" hidden>
    </figure>
    <figure>
      <figcaption>Sonra</figcaption>
      <img id="result-image" alt="" hidden>
    </figure>
  </div>

  <hr>
  <h2>Yüz Değiştirme</h2>
  <form id="swap-form">
    <label>Kaynak yüz: <input type="file" id="source-input" name="source" accept="image/png, image/jpeg" required></label><br>
    <label>Hedef görsel: <input type="file" id="target-input" name="target" accept="image/png, image/jpeg" required></label><br>
    <button type="button" id="swap-inputs-button">⇄ Kaynak / Hedef Yerini Değiştir</button>
    <button type="submit">Değiştir</button>
  </form>
  <p id="swap-status"></p>
  <div class="before-after">
    <figure>
      <figcaption>Önce</figcaption>
      <img id="swap-original-image" alt="" hidden>
    </figure>
    <figure>
      <figcaption>Sonra</figcaption>
      <img id="swap-result-image" alt="" hidden>
    </figure>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
